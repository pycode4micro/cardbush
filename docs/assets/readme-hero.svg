<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CardBush — your workspace, your agent</title>
  <desc id="desc">A personal AI workspace for chat, voice, tools and remote desktops. Subtle moving lights connect a conversation card, a terminal and a voice waveform.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111320"/><stop offset="1" stop-color="#18192D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 200) rotate(90) scale(290 400)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8277E8" stop-opacity=".2"/><stop offset="1" stop-color="#8277E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="67" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEBAFF"/><stop offset="1" stop-color="#87D7F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ABA8DD" opacity=".12"/>
    </pattern>
    <clipPath id="bounds"><rect width="1280" height="400" rx="24"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, monospace; }
      .flow { stroke-dasharray: 6 12; animation: flow 8s linear infinite; }
      .light { animation: pulse 4s ease-in-out infinite; }
      .delay { animation-delay: -2s; }
      .wave { transform-box: fill-box; transform-origin: center; animation: wave 1.8s ease-in-out infinite; }
      .wave-b { animation-delay: -.6s; }
      .wave-c { animation-delay: -1.2s; }
      @keyframes flow { to { stroke-dashoffset: -144; } }
      @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes wave { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .flow, .light, .wave { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="400" fill="url(#background)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <rect x="660" width="620" height="400" fill="url(#grid)"/>
    <path d="M704 104H738V241H827M1099 241H1210V113H1170" stroke="#494766" stroke-width="1.5"/>
    <path class="flow" d="M704 104H738V241H827M1099 241H1210V113H1170" stroke="#A8A1ED" stroke-width="1.5"/>
    <circle class="light" cx="704" cy="104" r="4" fill="#B8B0FF"/>
    <circle class="light delay" cx="1210" cy="177" r="4" fill="#8ACBE3"/>
    <text x="64" y="76" fill="#B6B1DE" font-size="12" font-weight="600" letter-spacing="3">PERSONAL AI WORKSPACE</text>
    <text x="59" y="183" fill="#F4F2FF" font-size="86" font-weight="700" letter-spacing="-4">CardBush</text>
    <text x="64" y="231" fill="url(#accent)" font-size="27" font-weight="500">Your workspace. Your agent.</text>
    <text x="65" y="277" fill="#A9ABC4" font-size="17">Talk, build and automate — from desktop to cloud.</text>
    <rect x="64" y="323" width="5" height="5" rx="2.5" fill="#9DDABD"/>
    <text x="81" y="330" fill="#989AB5" font-size="12" letter-spacing="1.4">OPEN SOURCE  /  BUILT TO MAKE IT YOURS</text>
    <rect x="780" y="50" width="390" height="134" rx="18" fill="#202137" stroke="#3D3E5A"/>
    <circle cx="807" cy="77" r="4" fill="#B5ACFF"/>
    <text x="821" y="82" fill="#C5C1E4" font-size="12" font-weight="600">CONVERSATION</text>
    <rect x="875" y="100" width="272" height="33" rx="12" fill="#34304D"/>
    <text x="891" y="122" fill="#EEEBFF" font-size="13">Let's make something useful.</text>
    <path d="M804 155H980M804 163H929" stroke="#797695" stroke-width="3" stroke-linecap="round"/>
    <circle class="light" cx="999" cy="159" r="3" fill="#B8B0FF"/>
    <rect x="794" y="204" width="286" height="112" rx="16" fill="#161C2B" stroke="#3D435B"/>
    <text class="mono" x="817" y="235" fill="#94D9C0" font-size="13">&gt; tools + skills + your ideas</text>
    <path d="M817 256H981M817 272H924M817 288H961" stroke="#545D78" stroke-width="4" stroke-linecap="round"/>
    <rect class="light delay" x="974" y="281" width="7" height="13" rx="1" fill="#94D9C0"/>
    <rect x="1040" y="252" width="160" height="98" rx="20" fill="#26233C" stroke="#514968"/>
    <g stroke="#BAB1F8" stroke-width="4" stroke-linecap="round">
      <path class="wave" d="M1075 294V307"/><path class="wave wave-b" d="M1090 285V316"/>
      <path class="wave wave-c" d="M1105 278V323"/><path class="wave" d="M1120 286V315"/>
      <path class="wave wave-b" d="M1135 277V324"/><path class="wave wave-c" d="M1150 285V316"/>
      <path class="wave" d="M1165 294V307"/>
    </g>
    <rect x=".5" y=".5" width="1279" height="399" rx="23.5" stroke="#41415B" stroke-opacity=".5"/>
  </g>
</svg>
