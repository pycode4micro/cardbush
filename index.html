<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>cardbush</title>
    <script>
      (() => {
        const isCardlingWindow =
          new URLSearchParams(location.search).get('window') === 'cardling';
        if (isCardlingWindow) {
          document.documentElement.dataset.cardlingWindow = 'true';
          document.documentElement.style.backgroundColor = 'transparent';
          return;
        }
        const colors = {
          dark: '#1a1a1a',
          bright: '#f5f3ef',
          cyberpunk: '#050607',
        };
        let theme = 'dark';
        let customColors = {};
        try {
          const preference = localStorage.getItem('cardbush_theme_mode');
          const legacy = preference ? null : localStorage.getItem('cardbush.theme');
          let importedBase = '';
          if (preference === 'custom') {
            try {
              const imported = JSON.parse(
                localStorage.getItem('cardbush_imported_theme_style') || 'null',
              );
              const colorKeys = ['background', 'surface', 'surfaceStrong', 'surfaceRaised', 'border',
                'accent', 'accentSoft', 'text', 'textMuted', 'textSoft', 'userBubble', 'terminalBackground', 'danger'];
              const safeColor = value => typeof value === 'string' && value.trim().length <= 96 &&
                (/^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value.trim()) ||
                  /^(rgb|rgba|hsl|hsla)\([\d\s.,%/+\-]+\)$/.test(value.trim()));
              if (imported?.protocol === 'cardbush.appearance_style.v1' && typeof imported.name === 'string' &&
                  imported.name.trim().length > 0 && imported.name.trim().length <= 64 && imported.colors &&
                  typeof imported.colors === 'object' && !Array.isArray(imported.colors)) {
                const palette = Object.fromEntries(Object.entries(imported.colors)
                  .filter(([key, value]) => colorKeys.includes(key) && safeColor(value)));
                if (Object.keys(palette).length) {
                  importedBase = ['light', 'dark'].includes(imported.base)
                    ? imported.base : imported.base === 'parchment' ? 'light' : '';
                  if (importedBase) customColors = palette;
                }
              }
            } catch {
              importedBase = '';
            }
          }
          if (preference === 'cyberpunk') {
            theme = 'cyberpunk';
          } else if (preference === 'custom' && importedBase) {
            theme = importedBase === 'light' ? 'bright' : importedBase;
          } else if (preference === 'dark') {
            theme = 'dark';
          } else if (preference === 'light') {
            theme = 'bright';
          } else if (legacy === 'dark') {
            theme = 'dark';
          } else if (legacy === 'bright') {
            theme = 'bright';
          } else {
            theme = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'bright';
          }
        } catch {
          theme = 'dark';
        }
        document.documentElement.dataset.startTheme = theme;
        const background = customColors.background || colors[theme] || colors.dark;
        const text = customColors.text || (theme === 'bright' ? '#1e1c1a' : '#f0ede7');
        const accent = customColors.accent || (theme === 'cyberpunk' ? '#00e7f0' : '#7b9e87');
        document.documentElement.style.colorScheme = theme === 'bright' ? 'light' : 'dark';
        document.documentElement.style.setProperty('--cardbush-window-bg', background);
        document.documentElement.style.setProperty('--cardbush-startup-text', text);
        document.documentElement.style.setProperty('--cardbush-startup-accent', accent);
        document.documentElement.style.backgroundColor = background;
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--cardbush-window-bg, #1a1a1a);
      }

      #cardbush-startup-splash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        color: var(--cardbush-startup-text, #f0ede7);
        background:
          radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--cardbush-startup-accent, #7b9e87) 18%, transparent), transparent 34%),
          var(--cardbush-window-bg, #1a1a1a);
        font-family:
          "Microsoft YaHei UI", Inter, "Segoe UI", "PingFang SC", "Noto Sans SC",
          Arial, sans-serif;
      }

      .cardbush-startup-inner {
        display: grid;
        place-items: center;
        gap: 16px;
        transform: translateY(-8px);
      }

      .cardbush-startup-logo {
        width: 132px;
        height: 132px;
        object-fit: contain;
        filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.36));
      }

      .cardbush-startup-wordmark {
        margin-top: -8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .cardbush-startup-rhythm {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
      }

      .cardbush-startup-rhythm span {
        width: 4px;
        height: 9px;
        border-radius: 999px;
        background: var(--cardbush-startup-accent, #7b9e87);
        opacity: 0.58;
        animation: cardbush-startup-rhythm 960ms ease-in-out infinite;
      }

      .cardbush-startup-rhythm span:nth-child(2) {
        animation-delay: 90ms;
      }

      .cardbush-startup-rhythm span:nth-child(3) {
        animation-delay: 180ms;
      }

      .cardbush-startup-rhythm span:nth-child(4) {
        animation-delay: 270ms;
      }

      .cardbush-startup-rhythm span:nth-child(5) {
        animation-delay: 360ms;
      }

      html[data-start-theme='cyberpunk'] #cardbush-startup-splash {
        color: #f4f3dc;
        background:
          radial-gradient(circle at 50% 43%, rgba(0, 231, 240, 0.12), transparent 30%),
          linear-gradient(rgba(247, 240, 0, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(247, 240, 0, 0.055) 1px, transparent 1px),
          #050607;
        background-size: auto, 36px 36px, 36px 36px, auto;
      }

      html[data-start-theme='cyberpunk'] .cardbush-startup-inner {
        padding: 28px 46px 24px;
        border: 1px solid rgba(247, 240, 0, 0.72);
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
      }

      html[data-start-theme='cyberpunk'] .cardbush-startup-logo {
        filter: drop-shadow(8px 0 0 rgba(0, 231, 240, 0.18));
      }

      html[data-start-theme='cyberpunk'] .cardbush-startup-wordmark {
        color: #f7f000;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      html[data-start-theme='cyberpunk'] .cardbush-startup-rhythm span {
        background: #00e7f0;
        border-radius: 0;
      }

      @keyframes cardbush-startup-rhythm {
        0%,
        100% {
          height: 8px;
          opacity: 0.42;
        }

        45% {
          height: 22px;
          opacity: 0.96;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cardbush-startup-rhythm span {
          animation: none;
          height: 12px;
          opacity: 0.7;
        }
      }

      html[data-cardling-window='true'],
      html[data-cardling-window='true'] body,
      html[data-cardling-window='true'] #root {
        background: transparent !important;
      }

      html[data-cardling-window='true'] body::before,
      html[data-cardling-window='true'] body::after {
        content: none !important;
      }

      html[data-cardling-window='true'] #cardbush-startup-splash {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cardbush-startup-splash" role="status" aria-label="cardbush 正在启动">
        <div class="cardbush-startup-inner">
          <img class="cardbush-startup-logo" src="./cardbush-logo.png" alt="" />
          <div class="cardbush-startup-wordmark">cardbush</div>
          <div class="cardbush-startup-rhythm" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
