name: Desktop builds
on:
  push:
    branches: [main, 'codex/cross-platform-release']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1 libfuse2 fonts-noto-cjk xvfb bubblewrap
      - run: npm ci
      - run: npm run runtime-tools:install
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.json
      - name: Native command sandbox boundaries
        run: node --test packages/bush-runtime/test/commandSandboxPolicy.test.mjs packages/bush-runtime/test/commandPermission.test.mjs packages/bush-runtime/test/commandSandboxLive.test.mjs packages/bush-runtime/test/executionSandbox.test.mjs
      - name: Windows regression and adversarial tests
        if: runner.os == 'Windows'
        run: npm run test:release
      - name: Linux regression and adversarial tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:release
      - name: Windows development installer (unsigned, not for public distribution)
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Signed Windows release installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --config electron-builder.release.yml --win nsis --x64 --publish never
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Windows packaged application
        if: runner.os == 'Windows'
        env:
          CARDBUSH_SMOKE_REPORT: release/smoke-windows.json
        run: node scripts/verify-packaged-platform.mjs release/win-unpacked
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1
      - name: Linux AppImage startup
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CARDBUSH_SMOKE_REPORT: release/smoke-linux.json
        run: |
          chmod +x release/*.AppImage
          xvfb-run -a node scripts/run-packaged-smoke.mjs "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
      - run: node scripts/release-checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: CardBush-${{ matrix.platform }}-x64
          if-no-files-found: error
          path: |
            release/CardBush-*.exe
            release/CardBush-*.AppImage
            release/SHA256SUMS-*.txt
            release/smoke-*.json
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: CardBush-*-x64
          merge-multiple: true
          path: release-assets
      - name: Validate version and both installers
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("Tag and package version differ");'
          test -s "release-assets/CardBush-${RELEASE_TAG#v}-windows-x64.exe"
          test -s "release-assets/CardBush-${RELEASE_TAG#v}-linux-x86_64.AppImage"
          (cd release-assets && sha256sum --check SHA256SUMS-win32-x64.txt SHA256SUMS-linux-x64.txt)
      - name: Publish validated beta
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'This release is already public; refusing to replace its files.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "CardBush $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
