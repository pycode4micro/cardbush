<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CardBush · 确认连接</title><link rel="stylesheet" href="connection.css"></head>
<body><main>
  <img src="icons/cardbush-48.png" alt=""><h1>允许 CardBush 连接此浏览器？</h1>
  <p>请先确认你已在 CardBush 系统弹窗中允许了本次请求。</p>
  <p>连接后，本机 App 和 CLI 将共用此浏览器并自动重连。网页访问仍需单独授权，可随时移除连接。</p>
  <footer><button id="cancel" autofocus>取消</button><button id="allow">允许连接</button></footer>
  <small id="status" role="status"></small>
</main><script src="connection.js"></script></body>
</html>
