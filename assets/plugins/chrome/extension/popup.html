<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardBush Browser Use</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><img class="mark" src="icons/cardbush-48.png" alt="" /><div><strong>CardBush</strong><small>Browser Use · Chrome / Edge</small></div></header>
      <div id="connection" class="connection">正在读取连接状态…</div>
      <div id="extension-update" class="extension-update" hidden>
        <p id="extension-update-message" class="hint" role="status"></p>
        <button id="reload-extension">重新加载扩展</button>
      </div>
      <div id="local-connection-repair" hidden>
        <p class="hint">旧连接持续失败时，可重新申请连接当前本机 App/CLI。需要在扩展窗口确认一次；成功前保留原配对，网站授权不会清除。</p>
        <button data-action="request_local_connection">重新申请本机连接</button>
      </div>
      <details id="pairing-details"><summary>手动连接 / 远程 Agent 配对</summary>
      <p class="hint">仅用于手动连接或远程 Agent 配对。从目标 Agent 的 CLI 运行 /browser pair chrome 或 /browser pair edge，或在 CardBush 设置中生成本机手动配对码；直接粘贴在此处，不发送给模型。</p>
      <label class="scope-picker"><span>目标 Agent 的配对码</span>
        <input id="pairing-code" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴目标 Agent 提供的配对码" />
      </label>
      <button data-action="pair">配对并连接</button>
      </details>
      <p id="site-access" class="hint" aria-live="polite"></p>
      <div id="scope" class="scope">等待 CardBush 会话…</div>
      <label id="scope-picker" class="scope-picker" hidden>
        <span>目标会话</span>
        <select id="scope-select" aria-label="目标 CardBush 会话"></select>
      </label>
      <section>
        <strong id="tab-title">当前标签页</strong>
        <small id="tab-origin"></small>
      </section>
      <div class="actions">
        <button data-action="allow_once">复制到隔离组 · 仅本次</button>
        <button data-action="allow_site">复制并始终允许此网站</button>
        <button data-action="allow_all">复制并允许隔离组访问全部网站</button>
      </div>
      <footer>
        <button class="quiet" data-action="reconnect">连接 CardBush</button>
        <button class="quiet" data-action="disable_connector">关闭扩展连接</button>
        <button class="quiet" data-action="revoke">撤销授权</button>
        <button class="quiet" data-action="disconnect">停止控制</button>
      </footer>
      <p id="connection-help" class="hint"></p>
    </main>
    <script src="build-info.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
