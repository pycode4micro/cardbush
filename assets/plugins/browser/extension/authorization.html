<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardBush</title><link rel="stylesheet" href="connection.css">
</head>
<body>
  <main aria-labelledby="heading">
    <header><img src="icons/cardbush-48.png" alt=""><span>CardBush</span></header>
    <h1 id="heading"></h1>
    <p id="description" class="description"></p>
    <div class="details"><p id="origin"></p><p id="scope"></p></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer class="site-actions">
      <button id="cancel" autofocus></button>
      <button id="once" disabled></button>
      <button id="site" disabled></button>
    </footer>
  </main>
  <script src="i18n.js"></script><script src="authorization.js"></script>
</body>
</html>
