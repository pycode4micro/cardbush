<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardBush</title><link rel="stylesheet" href="connection.css">
</head>
<body>
  <main aria-labelledby="heading">
    <header><img src="icons/cardbush-48.png" alt=""><span>CardBush</span><small id="connection-title"></small></header>
    <div class="connection-route" aria-hidden="true">
      <span class="route-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M7 6h.01M10 6h.01"/></svg></span>
      <span class="route-line"></span>
      <span class="route-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg></span>
    </div>
    <h1 id="heading"></h1>
    <p id="description" class="description"></p>
    <div class="details">
      <p><span class="detail-mark" aria-hidden="true">✓</span><span id="connection-isolation"></span></p>
      <p><span class="detail-mark" aria-hidden="true">✓</span><span id="connection-reconnect"></span></p>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer><button id="cancel" autofocus></button><button id="allow" disabled></button></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="connection.js"></script>
</body>
</html>
