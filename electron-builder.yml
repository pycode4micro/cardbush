appId: com.cardbush.desktop
productName: CardBush
asar: true
# Our hook still rebuilds required native modules; the default also rebuilds
# SSH's optional accelerators and fails on machines without a C++ toolchain.
npmRebuild: false
beforePack: scripts/rebuild-native-dependencies.cjs
afterPack: scripts/package-privacy-check.cjs
asarUnpack:
  # Canvas loads ICU data adjacent to the native binding, outside Electron's virtual FS.
  - '**/node_modules/@napi-rs/**/*'
  - node_modules/@img/**/*
  - node_modules/sharp/**/*
  - packages/cardbush-apps-mcp/dist/native/**/*.dll
  - '**/*.exe'
  - '**/*.dll'
  - '**/*.node'
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist-electron/productA2A.js'
  # Exclude artifacts left by builds before the native Team replacement.
  - '!dist-electron/teamPlugin.js'
  - '!packages/bush-runtime/dist/teamTool.*'
  - '!packages/bush-runtime/dist/teamSnapshotStore.*'
  - packages/*/dist/**/*
  - packages/*/dist-cjs/**/*
  - packages/*/package.json
  - packages/cardbush-document-tools/THIRD_PARTY_NOTICES.md
  - assets/**/*
  - '!assets/plugins/chrome/extension/**/*'
  - '!assets/skills/**/*'
  - '!assets/runtime-tools/**/*'
  - package.json
  - LICENSE
  - NOTICE
  - node_modules/**/*
  - '!packages/cardbush-team-plugin/**/*'
  - '!node_modules/@cardbush/team-plugin/**/*'
  - '!node_modules/.cache/**/*'
  - '!node_modules/cpu-features/**/*'
  - '!node_modules/ssh2/lib/protocol/crypto/build/**/*'
  - '!**/*.map'
  - '!assets/plugins/**/__pycache__/**/*'
  - '!assets/plugins/**/*.pyc'
  - '!**/*.pfx'
  - '!**/*.p12'
  - '!**/*.key'
  - '!**/.env'
  - '!**/.env.*'
  - '!**/identity.local.json'
  - '!**/signing.local.json'
extraResources:
  - from: native/voice/custom_tts.py
    to: voice/custom_tts.py
  - from: assets/connector-maintenance
    to: connector-maintenance
    filter: ['*.ps1']
  - from: assets/plugins/chrome/extension
    to: chrome-extension
    filter:
      - '**/*'
  - from: assets/skills
    to: skills
    filter:
      - '**/*'
      - '!**/__pycache__/**/*'
      - '!**/*.pyc'
win:
  icon: assets/cardbush.ico
  artifactName: CardBush-${version}-windows-${arch}.${ext}
  extraResources:
    - from: dist-native/voice
      to: voice
      filter: [CardBushVoiceHost.exe, CardBushSpeakerHost.exe]
    - from: dist-native/process-guard
      to: process-guard
      filter: ['CardBushProcessHost-*.exe', current.json]
    - from: dist-native/chrome-connector
      to: chrome-native-host
      filter: [CardBushBrowserHost.exe]
    - from: assets/runtime-tools/ripgrep/win32-x64
      to: runtime-tools/ripgrep/win32-x64
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CardBush
  deleteAppDataOnUninstall: false
  license: LICENSE
linux:
  executableName: cardbush
  icon: public/cardbush-logo.png
  category: Development
  artifactName: CardBush-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
  extraResources:
    - from: assets/runtime-tools/ripgrep/linux-x64
      to: runtime-tools/ripgrep/linux-x64
publish: null
