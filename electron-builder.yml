appId: com.cardbush.desktop
productName: CardBush
asar: true
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist-electron/productA2A.js'
  - packages/*/dist/**/*
  - packages/*/package.json
  - assets/**/*
  - '!assets/plugins/chrome/extension/**/*'
  - '!assets/skills/**/*'
  - '!assets/runtime-tools/**/*'
  - package.json
  - node_modules/**/*
  - '!node_modules/.cache/**/*'
  - '!**/*.map'
extraResources:
  - from: dist-native/chrome-connector
    to: chrome-native-host
    filter:
      - 'CardBushBrowserHost.exe'
  - from: assets/plugins/chrome/extension
    to: chrome-extension
    filter:
      - '**/*'
  - from: assets/runtime-tools
    to: runtime-tools
    filter:
      - '**/*'
  - from: assets/skills
    to: skills
    filter:
      - '**/*'
      - '!**/__pycache__/**/*'
      - '!**/*.pyc'
win:
  icon: assets/cardbush.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CardBush
artifactName: CardBush-${version}-${arch}.${ext}
